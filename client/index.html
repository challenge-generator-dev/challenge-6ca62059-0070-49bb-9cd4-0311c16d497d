<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistema de gestión de órdenes con operaciones CRUD en DynamoDB" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Order Management" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gestión de Órdenes" />
    <meta property="og:description" content="Sistema de gestión de órdenes con operaciones CRUD" />
    <meta property="og:url" content="http://localhost:5173" />
    <meta property="og:site_name" content="Order Management" />
    <title>Gestión de Órdenes</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      body {
        min-height: 100vh;
        background-color: #f8fafc;
        color: #1e293b;
      }
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f8fafc;
        z-index: 9999;
      }
      .loading-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #e2e8f0;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .error-container {
        padding: 2rem;
        text-align: center;
        max-width: 600px;
        margin: 0 auto;
      }
      .error-container h1 {
        color: #dc2626;
        margin-bottom: 1rem;
      }
      .error-container p {
        color: #64748b;
        margin-bottom: 1.5rem;
      }
      .retry-button {
        background-color: #2563eb;
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 500;
        transition: background-color 0.2s;
      }
      .retry-button:hover {
        background-color: #1d4ed8;
      }
      .retry-button:active {
        background-color: #1e40af;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading-screen">
        <div class="loading-spinner" role="status" aria-label="Cargando aplicación"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        const root = document.getElementById('root');
        const loadingScreen = root.querySelector('.loading-screen');
        
        window.addEventListener('error', function(event) {
          if (loadingScreen && event.error) {
            loadingScreen.innerHTML = `
              <div class="error-container">
                <h1>Error de aplicación</h1>
                <p>Ha ocurrido un error inesperado. Por favor, recarga la página.</p>
                <button class="retry-button" onclick="window.location.reload()">
                  Recargar página
                </button>
              </div>
            `;
          }
        });
        
        window.addEventListener('unhandledrejection', function(event) {
          console.error('Unhandled promise rejection:', event.reason);
        });
      })();
    </script>
  </body>
</html>
